name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      redis: # the shared-counter tests talk to it on 127.0.0.1:6379
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # The shared-counter tests skip without a store; in CI that would be a silent hole.
      - run: |
          out=$(go test -count=1 -run 'SharedCounter' -v ./internal/gateway/)
          if echo "$out" | grep -q -- '--- SKIP'; then
            echo 'shared-counter tests skipped in CI: the Redis service did not answer'
            exit 1
          fi
